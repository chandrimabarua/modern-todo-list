<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Royal Todo Pro</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
      * {
        font-family: "Poppins", sans-serif;
      }

      body {
        background: radial-gradient(
          circle at top,
          #312e81 0%,
          #0f172a 40%,
          #020617 100%
        );
      }

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-thumb {
        background: #6366f1;
        border-radius: 50px;
      }

      ::-webkit-scrollbar-track {
        background: #0f172a;
      }

      .glass {
        backdrop-filter: blur(16px);
        background: rgba(15, 23, 42, 0.75);
      }

      .cardHover {
        transition: 0.3s;
      }

      .cardHover:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 40px rgba(99, 102, 241, 0.15);
      }
    </style>
  </head>

  <body class="text-white min-h-screen">
    <div class="max-w-7xl mx-auto px-5 py-10">
      <!-- HEADER -->

      <div class="text-center mb-10">
        <h1
          class="text-5xl font-extrabold bg-gradient-to-r from-indigo-400 via-violet-300 to-cyan-300 bg-clip-text text-transparent"
        >
          MAKE YOUR TODO
        </h1>

        <p class="text-slate-400 mt-3">Organize your work beautifully.</p>
      </div>

      <!-- DASHBOARD -->

      <section class="grid lg:grid-cols-4 md:grid-cols-2 gap-5 mb-8">
        <div class="glass rounded-2xl p-6 border border-slate-700 cardHover">
          <p class="text-slate-400 text-sm">Total Tasks</p>

          <h2 id="totalTasks" class="text-4xl font-bold mt-2">0</h2>
        </div>

        <div class="glass rounded-2xl p-6 border border-slate-700 cardHover">
          <p class="text-slate-400 text-sm">Completed</p>

          <h2
            id="completedTasks"
            class="text-4xl font-bold text-green-400 mt-2"
          >
            0
          </h2>
        </div>

        <div class="glass rounded-2xl p-6 border border-slate-700 cardHover">
          <p class="text-slate-400 text-sm">Pending</p>

          <h2 id="pendingTasks" class="text-4xl font-bold text-yellow-400 mt-2">
            0
          </h2>
        </div>

        <div class="glass rounded-2xl p-6 border border-slate-700 cardHover">
          <div class="flex justify-between items-center">
            <span class="text-slate-400 text-sm"> Progress </span>

            <span id="progressText" class="font-semibold"> 0% </span>
          </div>

          <div
            class="w-full h-3 rounded-full bg-slate-700 mt-5 overflow-hidden"
          >
            <div
              id="progressBar"
              class="h-full w-0 bg-gradient-to-r from-indigo-500 to-cyan-400 transition-all duration-500"
            ></div>
          </div>
        </div>
      </section>

      <!-- ADD TASK -->

      <section class="glass border border-slate-700 rounded-3xl p-6 mb-8">
        <div class="grid lg:grid-cols-5 gap-4">
          <div class="lg:col-span-4">
            <input
              id="taskInput"
              type="text"
              placeholder="Write your task..."
              class="w-full rounded-xl bg-slate-900 border border-slate-700 px-5 py-4 outline-none focus:border-indigo-500"
            />
          </div>

          <button
            id="addTaskBtn"
            class="rounded-xl bg-indigo-600 hover:bg-indigo-700 duration-300 font-semibold"
          >
            Add Task
          </button>
        </div>
      </section>

      <!-- SEARCH & FILTER -->

      <section class="grid lg:grid-cols-2 gap-5 mb-8">
        <input
          id="searchInput"
          type="text"
          placeholder="Search task..."
          class="glass border border-slate-700 rounded-xl px-5 py-4 outline-none focus:border-indigo-500"
        />

        <select
          id="filterSelect"
          class="glass border border-slate-700 rounded-xl px-5 py-4 outline-none focus:border-indigo-500"
        >
          <option value="all">All Tasks</option>

          <option value="pending">Pending</option>

          <option value="completed">Completed</option>
        </select>
      </section>

      <!-- EMPTY STATE -->

      <section
        id="emptyState"
        class="glass border border-dashed border-slate-600 rounded-3xl py-20 text-center"
      >
        <div class="text-7xl">📋</div>

        <h2 class="text-2xl font-bold mt-5">No Tasks Found</h2>

        <p class="text-slate-400 mt-2">Add your first task to get started.</p>
      </section>

      <!-- TASK LIST -->

      <section id="taskList" class="grid gap-5 mt-8">
        <!-- JavaScript will generate task cards -->
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
