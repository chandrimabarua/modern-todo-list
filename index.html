<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Todo List</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      font-family: "Poppins", sans-serif;
    }

    body{
      background: linear-gradient(135deg,#0f172a,#1e293b,#312e81);
      background-size: 300% 300%;
      animation: gradient 12s ease infinite;
    }

    @keyframes gradient{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }
  </style>
</head>

<body class="min-h-screen flex justify-center items-center p-5">

  <div class="w-full max-w-2xl">

    <!-- Card -->
    <div class="bg-white/10 backdrop-blur-2xl border border-white/20 rounded-3xl shadow-2xl p-8">

      <!-- Header -->
      <div class="text-center mb-8">

        <div class="w-20 h-20 rounded-full bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-600 flex items-center justify-center text-4xl mx-auto shadow-xl">
          📝
        </div>

        <h1 class="text-4xl font-bold text-white mt-5">
          Todo List
        </h1>

        <p class="text-gray-300 mt-2">
          Stay productive. Complete your daily goals.
        </p>

      </div>

      <!-- Input -->

      <div class="flex gap-3">

        <input
          id="inputBox"
          type="text"
          placeholder="✨ Add your task..."
          class="flex-1 h-14 rounded-xl bg-white/20 text-white placeholder:text-gray-300 px-5 outline-none border border-white/20 focus:border-cyan-400 focus:ring-4 focus:ring-cyan-400/30 transition">

        <button
          id="addTask"
          class="px-8 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-semibold hover:scale-105 hover:shadow-xl transition duration-300 cursor-pointer">

          Add

        </button>

      </div>

      <!-- Divider -->

      <div class="my-7 border-t border-white/10"></div>

      <!-- List -->

      <ul
        id="ListContainer"
        class="space-y-4">

      </ul>

    </div>

  </div>

</body>

<script src="script.js"></script>

</html>
